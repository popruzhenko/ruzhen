services:
    postgres:
        image: postgres:17-alpine
        container_name: ruzhen-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: ruzhen_dev
        ports:
            - '5433:5432'
        volumes:
            - ruzhen_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d ruzhen_dev']
            interval: 5s
            timeout: 5s
            retries: 10

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        container_name: ruzhen-api
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ruzhen_dev?schema=public
            JWT_ACCESS_SECRET: ruzhen_access_secret
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
            PORT: 4000
        ports:
            - '4000:4000'

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
            args:
                VITE_API_URL: https://api.ruzhen.org/api
                VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        container_name: ruzhen-web
        restart: unless-stopped
        depends_on:
            - api
        ports:
            - '8080:80'

volumes:
    ruzhen_postgres_data: