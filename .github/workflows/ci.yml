name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
            - infra/github-actions-delivery

jobs:
    build:
        name: Build and validate
        runs-on: ubuntu-latest

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ruzhen_dev?schema=public

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma Client
              run: npm run prisma:generate -w apps/api

            - name: Check formatting
              run: npm run format:check

            - name: Build project
              run: npm run build