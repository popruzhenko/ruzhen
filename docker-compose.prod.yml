services:
    postgres:
        image: postgres:17-alpine
        container_name: ruzhen-postgres-prod
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - ruzhen_postgres_prod_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - ruzhen_prod_network

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        container_name: ruzhen-api-prod
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
            JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
            PORT: 4000
        expose:
            - '4000'
        networks:
            - ruzhen_prod_network

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
            args:
                VITE_API_URL: ${VITE_API_URL}
                VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        container_name: ruzhen-web-prod
        restart: unless-stopped
        depends_on:
            - api
        expose:
            - '80'
        networks:
            - ruzhen_prod_network

    nginx:
        image: nginx:1.29-alpine
        container_name: ruzhen-nginx-prod
        restart: unless-stopped
        depends_on:
            - web
            - api
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
            - ./certbot/www:/var/www/certbot:ro
            - ./certbot/conf:/etc/letsencrypt:ro
        networks:
            - ruzhen_prod_network
    
    certbot:
        image: certbot/certbot
        container_name: ruzhen-certbot
        volumes:
            - ./certbot/www:/var/www/certbot
            - ./certbot/conf:/etc/letsencrypt
        networks:
            - ruzhen_prod_network

volumes:
    ruzhen_postgres_prod_data:

networks:
    ruzhen_prod_network:
        driver: bridge